<h1 class="h3 mb-3 text-dark">Cadastrar Aluno</h1>
<div class="card shadow-sm border-0 mb-4">
    <form class="card-body p-4">

        <!--row nome-->
        <div class="mb-3">
            <label for="nome" class="form-label fw-semibold">Nome:</label>
            <input type="text" id="nome" class="form-control" placeholder="Informe o Nome Completo do Aluno"
                name="nomeAluno" [(ngModel)]="nome">
        </div>

        <!--row idade-->
        <div class="mb-3">
            <label for="idade" class="form-label fw-semibold">Idade:</label>
            <input type="number" id="idade" class="form-control" placeholder="18" name="idadeAluno" [(ngModel)]="idade">
        </div>

        <!--row curso-->
        <div class="mb-3">
            <label for="curso" class="form-label fw-semibold">Curso:</label>
            <input type="text" id="curso" class="form-control" placeholder="Informe o Curso do Aluno" name="cursoAluno"
                [(ngModel)]="curso">
        </div>

        <!--row email-->
        <div class="mb-3">
            <label for="email" class="form-label fw-semibold">E-mail:</label>
            <input type="email" id="email" class="form-control" placeholder="Informe o E-mail do Aluno"
                name="emailAluno" [(ngModel)]="email">
        </div>

        <!--row cidade-->
        <div class="mb-4">
            <label for="cidade" class="form-label fw-semibold">Cidade:</label>
            <input type="text" id="cidade" class="form-control" placeholder="Informe a Cidade do Aluno"
                name="cidadeAluno" [(ngModel)]="cidade">
        </div>

        <!--row botões-->
        <div class="d-flex justify-content-between">
            <button type="button" class="btn btn-outline-secondary" (click)="restaurarDados()">
                Restaurar Dados
            </button>
            <button type="button" class="btn btn-success px-4" (click)="salvarDados()">
                Salvar
            </button>
        </div>

    </form>
</div>

<h2 class="h3 mb-3 text-dark">Dados do Aluno</h2>
<div class="card shadow-sm border-0">
    <ul>
        <li><strong>Nome:</strong> {{nome}}</li>
        <li><strong>Idade:</strong> {{idade}}</li>
        <li><strong>Curso:</strong> {{curso}}</li>
        <li><strong>E-mail:</strong> {{email}}</li>
        <li><strong>Cidade:</strong> {{cidade}}</li>
    </ul>
</div>
